name: Compiler le .exe (Windows)

# Se déclenche à chaque push sur main, à chaque pull request, et manuellement
# (bouton "Run workflow" dans l'onglet Actions de GitHub).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'exécutable avec PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name TraitementMinerais `
            --distpath dist `
            app/main.py

      - name: Publier l'exécutable comme artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: TraitementMinerais-exe
          path: dist/TraitementMinerais.exe

      - name: Joindre l'exécutable à une release GitHub (si un tag vX.Y.Z est poussé)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TraitementMinerais.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
